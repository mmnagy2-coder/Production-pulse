kind = "web"
previewPath = "/"
title = "Production Pulse"
version = "1.0.0"
id = "artifacts/production-pulse"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21203

[services.development]
run = "pnpm --filter @workspace/production-pulse run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/production-pulse", "run", "build" ]
serve = "static"
publicDir = "artifacts/production-pulse/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21203"
BASE_PATH = "/"
